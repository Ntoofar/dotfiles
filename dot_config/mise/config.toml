min_version = "2026.9.17"

[tools]
go = "1.27.1"
node = "26.10.0"
uv = "0.12.22"

[tools."http:vscode"]
version = "1"
version_list_url = "https://update.code.visualstudio.com/api/releases/stable"
version_order = "semver"
strip_components = 1
bin_path = "bin"

[tools."http:vscode".platforms]
linux-x64 = {
    url = "https://update.code.visualstudio.com/{{version}}/linux-x64/stable",
    format = "tar.gz",
}
linux-arm64 = { url = "https://update.code.visualstudio.com/{{version}}/linux-arm64/stable", format = "tar.gz" }

[env]
_.path = ["{{env.HOME}}/.go/bin"]
GOPATH = "{{env.HOME}}/.go"
GOPROXY = "https://goproxy.cn,direct"
UV_DEFAULT_INDEX = "https://mirrors.aliyun.com/pypi/simple/"

[settings]
lockfile = true
